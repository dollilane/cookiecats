<div class="catering-form-box">
  <h3 class="form-title">Inquire for Catering</h3>
  <form class="catering-form">
    <label>Your Name</label>
    <input type="text" placeholder="First & Last Name" required />

    <label>Email</label>
    <input type="email" placeholder="name@email.com" required />

    <label>Event Date & Estimated Headcount / Tin Count</label>
    <input type="text" placeholder="e.g., Dec 12th — 25 tins" required />

    <label>Event Type</label>
    <select>
      <option>Corporate Gifting / Client Mailers</option>
      <option>Wedding / Reception Favors</option>
      <option>Private Party / Shower</option>
      <option>Other Special Gathering</option>
    </select>

    <button type="submit" class="catering-submit-btn">Send Inquiry</button>
  </form>
</div>
